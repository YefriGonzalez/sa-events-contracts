name: Publish to Maven Central

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Configure Maven Central credentials
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          mkdir -p ~/.m2

          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${CENTRAL_USERNAME}</username>
                <password>${CENTRAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF
      - name: Inspect Central bundle
        if: always()
        run: |
          echo "=== Project POM ==="
          ls -l pom.xml target/events-contracts-1.0.0.pom 2>/dev/null || true

          echo "=== Staged POMs ==="
          find target/central-staging -type f -name '*.pom' -print 2>/dev/null || true

          echo "=== Local metadata ==="
          find target/central-staging -type f \
            -name 'maven-metadata-local.xml' -print 2>/dev/null || true

          echo "=== All staged files ==="
          find target/central-staging -type f -print 2>/dev/null | sort || true

          echo "=== ZIP contents ==="
          if [ -f target/central-publishing/central-bundle.zip ]; then
            unzip -l target/central-publishing/central-bundle.zip
          fi
      - name: Publish
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn --batch-mode clean deploy
